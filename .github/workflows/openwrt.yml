name: Build OpenWrt

on:
  workflow_dispatch:

env:
  VERSION: 24.10.1
  TARGET: mediatek
  SUBTARGET: mt7622

jobs:
  openwrt:
    runs-on: ubuntu-24.04
    steps:
    - name: Setup Build Bot
      run: |
        sudo apt-get update -y
        sudo apt-get install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget libelf-dev dwarves -y

    - name: Download OpenWrt
      run: git clone https://git.openwrt.org/openwrt/openwrt.git -b v$VERSION OpenWrt

    - name: Update feeds
      working-directory: ./OpenWrt
      run: ./scripts/feeds update -a

    - name: Install feeds
      working-directory: ./OpenWrt
      run: ./scripts/feeds install -a

    - name: Get build config
      working-directory: ./OpenWrt
      run: |
        curl https://downloads.openwrt.org/releases/$VERSION/targets/$TARGET/$SUBTARGET/config.buildinfo -o .config
        cat <<EOF >> ./.config

        # Build Bot

        CONFIG_BUILDBOT=n
        CONFIG_ALL_NONSHARED=n
        CONFIG_IB=n
        CONFIG_SDK=n
        CONFIG_SDK_LLVM_BPF=n

        # Extra kernel config

        CONFIG_DWARVES=y
        CONFIG_KERNEL_ARM_PMU=y
        CONFIG_KERNEL_ARM_PMUV3=y
        CONFIG_KERNEL_BPF_EVENTS=y
        CONFIG_KERNEL_DEBUG_INFO_BTF=y
        CONFIG_KERNEL_DEBUG_INFO_BTF_MODULES=y
        CONFIG_KERNEL_DEBUG_INFO_REDUCED=n
        CONFIG_KERNEL_FTRACE=y
        CONFIG_KERNEL_KPROBE_EVENTS=y
        CONFIG_KERNEL_KPROBES=y
        CONFIG_KERNEL_PERF_EVENTS=y
        CONFIG_KERNEL_XDP_SOCKETS=y
        CONFIG_PACKAGE_kmod-xdp-sockets-diag=m
        CONFIG_PACKAGE_kselftests-bpf=m
        CONFIG_PACKAGE_libbfd=m
        CONFIG_PACKAGE_libbz2=m
        CONFIG_PACKAGE_libctf=m
        CONFIG_PACKAGE_libdw=m
        CONFIG_PACKAGE_libopcodes=m
        CONFIG_PACKAGE_libtraceevent=m
        CONFIG_PACKAGE_musl-fts=m
        CONFIG_PACKAGE_objdump=m
        CONFIG_PACKAGE_perf=m

        # Redmi AX6S / Xiaomi AX3200

        CONFIG_TARGET_ALL_PROFILES=n
        CONFIG_TARGET_MULTI_PROFILE=n
        CONFIG_TARGET_PER_DEVICE_ROOTFS=n
        CONFIG_TARGET_mediatek_mt7622_DEVICE_xiaomi_redmi-router-ax6s=y
        CONFIG_TARGET_PROFILE="DEVICE_xiaomi_redmi-router-ax6s"
        EOF
        make oldconfig -j$(nproc --all)

    - name: Build
      working-directory: ./OpenWrt
      run: make -j$(nproc --all)

    - name: Remove large files
      run: |
        rm -f ./OpenWrt/bin/targets/$TARGET/$SUBTARGET/kernel-debug.tar.zst
        rm -f ./OpenWrt/bin/targets/$TARGET/$SUBTARGET/openwrt-toolchain-$VERSION-$TARGET-$SUBTARGET_*.tar.zst

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: Firmware
        path: ./OpenWrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*.*
        if-no-files-found: error

    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: Packages
        path: ./OpenWrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/packages/*.*
        if-no-files-found: error

    - name: Purge Cloudflare R2
      continue-on-error: true
      uses: wei/rclone@v1
      env:
        RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      with:
        args: purge openwrt:openwrt --retries 1

    - name: Upload to Cloudflare R2
      uses: wei/rclone@v1
      env:
        RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      with:
        args: rclone copy ./OpenWrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/packages/ openwrt:openwrt
